name: ia-linea

services:
  mosquitto:
    image: eclipse-mosquitto:2
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    mem_limit: 64m

  sensor:
    build: .
    command: ["linea.sensor"]
    depends_on: [mosquitto]
    ports:
      - "9102:9102"        # métricas para Prometheus: http://localhost:9102/metrics
    environment: &entorno
      MQTT_HOST: mosquitto
      DATA_DIR: /data
      OPCUA_ENDPOINT: opc.tcp://opcua:4840/linea/server
      MODBUS_HOST: modbus
      MODBUS_PORT: "1502"
      PANEL_URL: http://panel:8501
      API_URL: http://api:8000
      LLM_URL: http://llm:8088
      PROMETHEUS_URL: http://prometheus:9090
      MODELO_PATH: /modelos/qwen2.5-0.5b-instruct-q4_k_m.gguf
    volumes: &datos
      - ./data:/data
      - ./linea:/opt/linea
    mem_limit: 192m

  archivador:
    build: .
    command: ["linea.archivador"]
    depends_on: [mosquitto]
    ports:
      - "9101:9101"        # métricas para Prometheus: http://localhost:9101/metrics
    environment: *entorno
    volumes: *datos
    mem_limit: 192m

  calidad:
    build: .
    command: ["linea.calidad"]
    depends_on: [mosquitto]
    environment: *entorno
    volumes: *datos
    mem_limit: 192m

  opcua:
    build: .
    command: ["linea.opcua_server"]
    ports:
      - "4840:4840"
    environment: *entorno
    volumes: *datos
    mem_limit: 256m

  modbus:
    build: .
    command: ["linea.modbus_server"]
    ports:
      - "1502:1502"
    environment: *entorno
    volumes: *datos
    mem_limit: 192m

  panel:
    build: .
    command: ["streamlit", "run", "/opt/linea/panel.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    ports:
      - "8501:8501"
    environment: *entorno
    volumes: *datos
    mem_limit: 512m

  modelo:                  # descarga única del GGUF a ./modelos; si ya está, termina enseguida
    build: .
    command: ["linea.descargar_modelo"]
    environment: *entorno
    volumes:
      - ./linea:/opt/linea
      - ./modelos:/modelos
    mem_limit: 512m
    restart: "no"

  llm:
    build: .
    command: ["linea.llm_servicio"]
    depends_on:
      modelo:
        condition: service_completed_successfully
    ports:
      - "8088:8088"
    environment: *entorno
    volumes:
      - ./data:/data
      - ./linea:/opt/linea
      - ./modelos:/modelos:ro
    mem_limit: 2g

  api:
    build: .
    command: ["uvicorn", "linea.inferencia_api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment: *entorno
    volumes: *datos
    mem_limit: 768m

  prometheus:
    image: prom/prometheus:v2.53.2
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
    ports:
      - "9090:9090"
    mem_limit: 256m

  lab:
    build: .
    entrypoint: ["python", "-m", "linea.cli"]
    environment: *entorno
    volumes:
      - ./data:/data
      - ./linea:/opt/linea
      - ./modelos:/modelos:ro
      - ./construye:/construye
    mem_limit: 2g
    profiles: ["lab"]
  n8n-carpeta:             # una vez: crea ./data/n8n, la única carpeta donde n8n puede escribir
    build: .
    entrypoint: ["sh", "-c", "mkdir -p /data/n8n && chown 1000:1000 /data/n8n"]
    volumes:
      - ./data:/data
    restart: "no"

  n8n:
    image: n8nio/n8n:2.48.5
    depends_on:
      n8n-carpeta:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Europe/Madrid
      GENERIC_TIMEZONE: Europe/Madrid
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /data          # el nodo de ficheros solo ve ./data (estado.json y la traza)
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data:ro                           # lee estado.json del sensor, sin poder tocarlo
      - ./data/n8n:/data/n8n                      # aquí escribe su traza
    mem_limit: 1g
    restart: unless-stopped

volumes:
  n8n_data: